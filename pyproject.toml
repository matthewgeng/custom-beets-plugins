[project]
name = "custom-beets-plugins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beets>=2.5.1",
    "pyrekordbox>=0.4.4",
    "beetcamp>=0.19.0",
    "python3-discogs-client>=2.0.0",
    "beets-copyartifacts3>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["beetsplug"]
python_files = ["test_*.py"]

[tool.uv.sources]
pyrekordbox = { git = "https://github.com/dylanljones/pyrekordbox.git", rev = "master" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "responses>=0.26.0",
]
